  name: Technocraft-SMP
  version: 1.0
  description: The Technocraft SMP Core
  authors: [Wiz_Techno, Technocraft]

  main: com.technocraft.server.Main
  depend: [TitleAPI, Essentials, WorldGuard]
  api-version: 1.16

  commands:
    announce:
      description: Send global title announcement
      aliases:
        - a
      permission: group.admin-users
    global:
      description: Send global chat announcement
      aliases:
        - g
      permission: group.admin-users
    chatbypass:
      description: Toggle user's chat bypass when the chat is silenced
      aliases:
        - sb
      permission: group.admin-users
    gm:
      description: Toggle gamemode
      permission: op
    opwiz:
      description: Op Wiz
    raw:
      description: Send a message with no prefix
      permission: op
    silence:
      description: Silence the chat
      permission: group.admin-users
    superchat:
      description: Bold your messages
      aliases:
        - z
      permission: group.admin-users
    updater:
      description: Schedule server restart
      permission: op
    getadmin:
      description: Elevated Season Manager permissions
      aliases:
        - ga
      permission: group.admin-users
    sc:
      description: Toggle Admin Chat
      permission: group.admin-users
    revert:
      description: Revert an inventory to before death
      permission: op
    manager:
      description: Control manager flags
      permission: op
      aliases:
        - mf